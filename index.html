<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Heart ❤️</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#060208}
body{display:grid;place-items:center;overflow:hidden;font-family:Arial,"Segoe UI",sans-serif}
canvas{display:block;width:min(100vw,100vh,800px);height:min(100vw,100vh,800px)}
.toolbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #4b1725;border-radius:14px;background:#10070bdc;backdrop-filter:blur(8px);opacity:.22;transition:opacity .2s}
.toolbar:hover,.toolbar:focus-within{opacity:1}
.toolbar input{width:150px;min-width:0;padding:9px 11px;border:1px solid #602234;border-radius:8px;background:#090408;color:#ffe9ed;font:14px Arial;outline:none}
.toolbar input:focus{border-color:#e34a65}
.toolbar button{padding:9px 13px;border:0;border-radius:8px;background:#a91d3d;color:white;font-weight:700;cursor:pointer}
.toolbar button:hover{background:#cf2b4f}
@media(max-width:430px){.toolbar{top:10px}.toolbar input{width:125px}}
</style>
</head>
<body>
<div class="toolbar">
  <input id="dedication" value="Havya" maxlength="32" aria-label="Nome da dedicatória">
  <button id="replay" type="button">Recomeçar</button>
</div>
<canvas id="art" width="800" height="800" aria-label="Coração formado por declarações de amor em 20 idiomas"></canvas>
<script>
(() => {
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const BG='#060208',SCALE=21,Y_OFFSET=20,DURATION=10000,TICK=16,ANIM=672,LIFT=34,GAP=7;
const SIZES=[9,10,11,12],NAME_SIZE=46,NAME_MAX=380;
const PHRASES=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
const FLASH=[1,.78,.78],NAME_COLOR=[1,.93,.94],NAME_GLOW=[.98,.10,.16];
let items=[],started=0,finishedAt=0,name='Havya',nameZone={y:0,w:0,h:0},lastFrame=0,shimmers=[],raf=0;
let seed=11;
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const clamp=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const dim=(a,k)=>a.map(v=>v*k);
const hex=c=>'#'+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,'0')).join('');
const pulse=v=>Math.sin(Math.PI*v);
function heart(a){return [16*Math.sin(a)**3*SCALE,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*SCALE+Y_OFFSET]}
const poly=Array.from({length:720},(_,i)=>heart(2*Math.PI*i/720));
const edges=poly.map((p,i)=>[p,poly[(i+1)%poly.length]]);
const ys=poly.map(p=>p[1]),YMAX=Math.max(...ys),YMIN=Math.min(...ys),CY=(YMAX+YMIN)/2;
function spans(y){
 const xs=[];
 for(const [[x1,y1],[x2,y2]] of edges) if((y1<=y&&y<y2)||(y2<=y&&y<y1)) xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
 xs.sort((a,b)=>a-b);const out=[];
 for(let i=0;i+1<xs.length;i+=2)out.push([xs[i],xs[i+1]]);
 return out;
}
function intersect(a,b){const out=[];for(const x of a)for(const y of b){const lo=Math.max(x[0],y[0]),hi=Math.min(x[1],y[1]);if(hi-lo>14)out.push([lo,hi])}return out}
function radial(x,y){return Math.hypot(x/(16*SCALE),(y-CY)/(14.5*SCALE))}
function measure(text,size){ctx.font=`bold ${size}px Arial, "Segoe UI", sans-serif`;return ctx.measureText(text).width}
function layout(){
 seed=11;items=[];
 name=document.getElementById('dedication').value.trim()||'Havya';
 let ns=NAME_SIZE,nw=0,nh=54;
 while(ns>14){nw=measure(name,ns);if(nw<=NAME_MAX)break;ns-=2}
 nw=measure(name,ns);ctx.font=`bold ${ns}px Arial, "Segoe UI", sans-serif`;nh=ctx.measureText('Mg').actualBoundingBoxAscent+ctx.measureText('Mg').actualBoundingBoxDescent;
 nameZone={y:CY,w:nw/2+18,h:nh/2+8};
 const rowH=20,half=rowH/2,placed=[];
 let phraseIndex=0,order=[];
 function nextPhrase(){if(!order.length){order=PHRASES.slice();for(let i=order.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}return order.pop()}
 for(let y=YMAX-half;y>YMIN+half;y-=rowH){
   let row=intersect(spans(y+half),spans(y-half));
   if(Math.abs(y-nameZone.y)<nameZone.h+half){
     const cut=[];for(const [lo,hi] of row){for(const [a,b] of [[lo,Math.min(hi,-nameZone.w)],[Math.max(lo,nameZone.w),hi]])if(b-a>14)cut.push([a,b])}row=cut;
   }
   for(let [lo0,hi0] of row){
     let lo=lo0+4,hi=hi0-4,cur=lo+random()*8,line=[];
     while(true){
       let fit=null;
       for(let k=0;k<10;k++){let text=nextPhrase(),size=SIZES[Math.floor(random()*SIZES.length)],w=measure(text,size);if(cur+w<=hi){fit={text,size,w};break}}
       if(!fit)break;
       line.push({x:cur+fit.w/2,text:fit.text,size:fit.size,w:fit.w});cur+=fit.w+GAP;
     }
     if(!line.length)continue;
     if(line.length>1){let left=hi-(line[line.length-1].x+line[line.length-1].w/2);line.forEach((p,i)=>p.x+=left*i/(line.length-1))}
     else line[0].x=(lo+hi)/2;
     line.forEach((p,i)=>placed.push({...p,y,edge:i===0||i===line.length-1}));
   }
 }
 const wine=[.58,0,.09],crimson=[.90,.05,.14],blood=[.98,.10,.16];
 for(const p of placed){let rad=Math.min(1,radial(p.x,p.y)),base=mix(wine,crimson,.25+.75*rad);base=mix(base,blood,random()*.35+(p.edge?.3:0));p.color=base.map(v=>Math.min(1,v));p.rad=rad}
 const outer=placed.filter(p=>p.edge),inner=placed.filter(p=>!p.edge);
 outer.sort((a,b)=>Math.atan2(a.x,a.y-CY)-Math.atan2(b.x,b.y-CY));
 inner.sort((a,b)=>-a.rad+b.rad+(random()-.5)*.08);
 items=outer.concat(inner);
}
function drawText(text,x,y,size,color,shadow=0){
 ctx.font=`bold ${size}px Arial, "Segoe UI", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 if(shadow){ctx.shadowColor=color;ctx.shadowBlur=shadow}
 ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.shadowBlur=0;
}
function fitCanvas(){
 const dpr=Math.min(window.devicePixelRatio||1,2),rect=canvas.getBoundingClientRect();
 const w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
}
function render(now){
 const w=canvas.width,h=canvas.height,scale=Math.min(w/800,h/800);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,w,h);
 ctx.translate(w/2,h/2);ctx.scale(scale,scale);
 const elapsed=now-started,rate=items.length/(DURATION/TICK),step=elapsed/TICK;
 items.forEach((p,i)=>{
   const spawnAt=200+i/rate*TICK;
   if(elapsed<spawnAt)return;
   const u=clamp((elapsed-spawnAt)/ANIM),e=1-(1-u)**3,c=p.color;
   const x=p.x+p.dx*(1-e),y=-p.y-(1-e)*LIFT;
   if(u<1){
     drawText(p.text,x+2,y+3, p.size,hex(mix([.024,.008,.031],dim(c,.30),e)));
     drawText(p.text,x,y,p.size+1,hex(mix([.024,.008,.031],dim(c,.20),e*e)),2);
     const flash=.75*pulse(clamp((u-.55)/.45)),col=mix(mix([.024,.008,.031],c,e**1.5),FLASH,flash);
     drawText(p.text,x,y,p.size,hex(col),1);
   }else{
     drawText(p.text,p.x+2,-p.y+3,p.size,hex(dim(c,.30)));
     drawText(p.text,p.x,-p.y,p.size,hex(c),1);
   }
 });
 const allDone=elapsed>=200+(items.length-1)/rate*TICK+ANIM;
 if(allDone){
   if(!finishedAt)finishedAt=now;
   const u=clamp((now-finishedAt)/1280),e=1-(1-u)**3,k=.5+.5*Math.sin(now/450);
   let ns=NAME_SIZE;while(ns>14&&measure(name,ns)>NAME_MAX)ns-=2;
   const ny=-nameZone.y;
   drawText(name,0,ny,ns+4,hex(mix([.024,.008,.031],dim(NAME_GLOW,.35),e)),14+10*k);
   drawText(name,2,ny+3,ns,hex(mix([.024,.008,.031],dim(NAME_GLOW,.55),e)));
   drawText(name,0,ny,ns,hex(mix(mix([.024,.008,.031],NAME_COLOR,e),FLASH,.6*pulse(u))),5+8*k);
   if(now-lastFrame>260){lastFrame=now;let p=items[Math.floor(random()*items.length)];if(p)shimmers.push({p,until:now+150})}
   shimmers=shimmers.filter(s=>s.until>now);
   for(const s of shimmers)drawText(s.p.text,s.p.x,-s.p.y,s.p.size,hex(mix(s.p.color,FLASH,.6)),2);
 }
 raf=requestAnimationFrame(render);
}
function restart(){cancelAnimationFrame(raf);layout();started=performance.now();finishedAt=0;lastFrame=0;shimmers=[];raf=requestAnimationFrame(render)}
document.getElementById('replay').addEventListener('click',restart);
document.getElementById('dedication').addEventListener('keydown',e=>{if(e.key==='Enter')restart()});
window.addEventListener('resize',fitCanvas);
fitCanvas();restart();
})();
</script>
</body>
</html>
